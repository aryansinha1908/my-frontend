<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator APP</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <!--___ The Screen of the Calculator ___-->
      <section class="screen" id="screen">
        <h2 id="answer">0</h2>
      </section>

      <div class="buttons">
        <div class="rows">
          <button class="row1">C</button>
          <button class="row1">AC</button>
          <button class="row1">%</button>
          <button class="row1">/</button>
        </div>
        <div class="rows">
          <button class="row2">7</button>
          <button class="row2">8</button>
          <button class="row2">9</button>
          <button class="row2">x</button>
        </div>
        <section class="rows">
          <button class="row3">4</button>
          <button class="row3">5</button>
          <button class="row3">6</button>
          <button class="row3">-</button>
        </section>
        <section class="rows">
          <button class="row4">1</button>
          <button class="row4">2</button>
          <button class="row4">3</button>
          <button class="row4">+</button>
        </section>
        <section class="rows">
          <button class="row5">0</button>
          <button class="row5">.</button>
          <button class="row5">=</button>
        </section>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
